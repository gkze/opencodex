name: Retry unassigned fork nightly jobs
# GitHub cancels a hosted job it cannot place on a runner (mostly macOS when that pool is short).
# Re-run those jobs of a failed publish, a bounded number of times; leave real failures alone.
on:
  workflow_run:
    workflows: [Publish fork nightly]
    types: [completed]
permissions: {}
concurrency:
  # Not fork-maintenance: this job waits on the publish run, which holds that group on re-run.
  group: fork-nightly-retry-${{ github.event.workflow_run.id }}
  cancel-in-progress: false
jobs:
  retry:
    if: >-
      github.repository == 'gkze/opencodex' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'gkze/patches'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - run: node --test scripts/fork/retry-unacquired.test.js
      - name: Re-run jobs GitHub never started
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/fork/retry-unacquired.mjs
