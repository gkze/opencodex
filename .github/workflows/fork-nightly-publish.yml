name: Publish fork nightly
on:
  workflow_run:
    workflows: [Fork nightly refresh]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: fork-nightly-publish
  cancel-in-progress: false
jobs:
  candidate:
    if: >-
      github.repository == 'gkze/opencodex' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'gkze/patches' &&
      (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    outputs:
      sha: ${{ steps.accept.outputs.candidate }}
      old: ${{ steps.accept.outputs.old }}
      upstream: ${{ steps.accept.outputs.upstream }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-input
          path: ${{ runner.temp }}/fork-nightly
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nightly-output
          path: ${{ runner.temp }}/fork-nightly
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: accept
        env:
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
        run: node scripts/fork/nightly.mjs accept "$RUNNER_TEMP/fork-nightly"
  validate:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
        with:
          role: test-runner
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run privacy:scan
      - run: bun run structure:check
      - run: bun run build:gui
      - name: Prepare fork package
        env:
          FORK_CANDIDATE: ${{ needs.candidate.outputs.sha }}
        run: node scripts/fork/package.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fork-package
          path: dist/fork/*
          if-no-files-found: error
          retention-days: 14
  smoke:
    needs: [candidate, validate]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-package
          path: dist/fork
      - name: Install and run exact package
        run: node scripts/fork/smoke.mjs dist/fork
  publish:
    needs: [candidate, validate, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fork-package
          path: dist/fork
      - name: Publish checked package and promote fork
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          FORK_PUSH_TOKEN: ${{ secrets.FORK_PUSH_TOKEN }}
          FORK_OLD: ${{ needs.candidate.outputs.old }}
          FORK_CANDIDATE: ${{ needs.candidate.outputs.sha }}
          FORK_UPSTREAM: ${{ needs.candidate.outputs.upstream }}
        run: node scripts/fork/publish.mjs dist/fork
