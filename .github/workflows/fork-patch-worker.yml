name: Fork patch worker
run-name: ${{ inputs.attempt }}
on:
  workflow_dispatch:
    inputs:
      attempt:
        required: true
        type: string
      control:
        required: true
        type: string
      runner:
        required: true
        type: choice
        options: [ubuntu-24.04, macos-15]
      payload:
        required: true
        type: string
permissions:
  contents: read
jobs:
  patch:
    if: github.repository == 'gkze/opencodex' && github.ref == 'refs/heads/gkze/patches'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-project-bun
        with:
          role: test-runner
      - run: bun install --cwd scripts/fork/orchestrator --frozen-lockfile --ignore-scripts
      - name: Replay and verify captured patch
        env:
          PATCH_TASK: ${{ inputs.payload }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: bun scripts/fork/orchestrator/worker.ts prepare
      - name: Independently validate without inference credentials
        env:
          PATCH_TASK: ${{ inputs.payload }}
        run: bun scripts/fork/orchestrator/worker.ts verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.attempt }}
          path: ${{ runner.temp }}/result/*
          if-no-files-found: error
          retention-days: 1
